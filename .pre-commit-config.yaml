repos:
  # Autoformat: markdown, javacsript
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: eslint
        name: lint
        language: system
        entry: "npm run install-eslint"
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
