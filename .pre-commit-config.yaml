repos:
  # Autoformat: markdown, javacsript
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: ef4a397f916211b4a39ccf9d3d9cbb6562157251  # frozen: v3.9.9
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: eslint
        name: lint
        language: system
        entry: "npm run install-eslint"
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
