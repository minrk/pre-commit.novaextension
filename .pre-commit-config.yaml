repos:
  # Autoformat: markdown, javacsript
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 0ee178619d696787ca73d210cc191d720868c631 # frozen: v3.9.6
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: eslint
        name: lint
        language: unsupported
        entry: "npm run install-eslint"
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
