repos:
  # Autoformat: markdown, javacsript
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: c035d5c3fc2ce295b961030061d09de67d9203dc # frozen: v3.10.1
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: eslint
        name: lint
        language: system
        entry: "npm run install-eslint"
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
